# Konfigurasi nginx untuk SisKA.
#
# Tujuannya menghilangkan IP dan nomor port dari alamat, sehingga link katalog
# yang dikirim bot ke WhatsApp pegawai berbentuk http://siska.rokeubmn.id/
# alih-alih http://192.168.221.44:3000/
#
# PRASYARAT — nginx tidak bisa menciptakan nama domain sendiri. Harus ada
# catatan DNS "siska.rokeubmn.id" yang menunjuk ke 192.168.221.44 lebih dulu.
# Karena gajihub.rokeubmn.id sudah berjalan dengan pola yang sama, kemungkinan
# besar tinggal menambah satu subdomain lewat pengelola DNS rokeubmn.id.
#
# CARA PASANG (di VPS):
#   sudo cp deploy/nginx-siska.conf /etc/nginx/sites-available/siska
#   sudo ln -s /etc/nginx/sites-available/siska /etc/nginx/sites-enabled/siska
#   sudo nginx -t          # WAJIB: uji dulu, jangan langsung reload
#   sudo systemctl reload nginx
#
# Setelah itu ubah .env lalu restart bot:
#   LINK_WEB_KATALOG=http://siska.rokeubmn.id/
#   pm2 restart bot-siska

server {
    listen 80;
    listen [::]:80;
    server_name siska.rokeubmn.id;

    # Dashboard barang mengirim foto sebagai base64 lewat POST/PUT /api/barang.
    # Default nginx hanya 1 MB dan akan menolaknya dengan 413 yang membingungkan
    # ("Request Entity Too Large"), padahal Express sendiri menerima sampai 50 MB.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pembuatan PDF laporan bisa memakan waktu saat fotonya besar; jangan
        # sampai nginx memutus lebih dulu dengan 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
