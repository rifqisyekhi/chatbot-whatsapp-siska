# =========================================================
# NGINX — ADMIN PANEL & KATALOG SISKA
# =========================================================
#
# Alamat: http://192.168.221.44:8002
#
# Sebelumnya berkas ini ditulis untuk siska.rokeubmn.id, tapi
# nama itu tidak pernah ada di DNS — sama seperti
# presensi.rokeubmn.id. Selama aplikasi ini internal dan belum
# punya domain, pembedanya nomor port.
#
# Kenapa nginx di 8002 dan bukan mengganti 3000: satu port
# hanya boleh dipakai satu proses. Node SisKA sudah memegang
# 3000, jadi nginx menempati kursi kosong dan meneruskan ke
# sana. Aplikasinya tidak perlu diubah sama sekali.
#
# CARA PASANG (di VPS):
#   sudo cp deploy/nginx-siska.conf /etc/nginx/sites-available/siska-8002
#   sudo ln -s /etc/nginx/sites-available/siska-8002 \
#              /etc/nginx/sites-enabled/siska-8002
#   sudo nginx -t          # WAJIB: uji dulu, jangan langsung reload
#   sudo systemctl reload nginx
#
# Kalau ufw aktif: sudo ufw allow 8002/tcp
#
# SETELAH TERBUKTI JALAN — ubah .env lalu restart bot, supaya
# tautan katalog yang dikirim ke WhatsApp pegawai memakai
# alamat baru:
#   LINK_WEB_KATALOG=http://192.168.221.44:8002/
#   pm2 restart bot-siska

server {
    listen 8002;
    listen [::]:8002;

    server_name _;

    # Dashboard barang mengirim foto sebagai base64 lewat
    # POST/PUT /api/barang. Default nginx hanya 1 MB dan akan
    # menolaknya dengan 413 yang membingungkan ("Request
    # Entity Too Large"), padahal Express menerima sampai
    # 50 MB.
    client_max_body_size 20m;

    access_log /var/log/nginx/siska-8002.access.log;
    error_log  /var/log/nginx/siska-8002.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pembuatan PDF laporan bisa memakan waktu saat
        # fotonya besar; jangan sampai nginx memutus lebih
        # dulu dengan 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
