# =========================================================
# POTONGAN BERSAMA — PENERUS KE NODE SISKA (127.0.0.1:3000)
# =========================================================
#
# Dipakai semua blok port modul lewat:
#     include snippets/siska-proxy.conf;
# Dipasang di /etc/nginx/snippets/siska-proxy.conf (lihat README.md).

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Pembuatan PDF (laporan berfoto, kwitansi banyak peserta) bisa lama;
# jangan sampai nginx memutus lebih dulu dengan 504.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
