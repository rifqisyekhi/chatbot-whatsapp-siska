# =========================================================
# NGINX :8004 — KENDARAAN DINAS
# =========================================================
#
# Alamat: http://192.168.221.44:8004  (→ /kendaraan)
#   /kendaraan               daftar kendaraan dinas
#   /kendaraan/pemeliharaan  rekap pemeliharaan (servis) + SPBY

server {
    listen 8004;
    listen [::]:8004;
    server_name _;

    # Foto nota servis dikirim base64.
    client_max_body_size 20m;

    access_log /var/log/nginx/siska-8004.access.log;
    error_log  /var/log/nginx/siska-8004.error.log;

    location = / { return 302 /kendaraan; }
    location ~ ^/admin/servis-kendaraan/?$ { return 302 /kendaraan/pemeliharaan; }

    location ~ ^/kendaraan(/pemeliharaan)?/?$ { include snippets/siska-proxy.conf; }
    location /assets/ { include snippets/siska-proxy.conf; }
    location ~ ^/(favicon\.svg|icons\.svg|logo-kemnaker\.png)$ { include snippets/siska-proxy.conf; }

    location ~ ^/api/(kendaraan|servis-kendaraan)(/|$) { include snippets/siska-proxy.conf; }

    location / { return 404; }
}
