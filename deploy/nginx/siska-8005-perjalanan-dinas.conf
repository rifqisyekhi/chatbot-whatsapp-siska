# =========================================================
# NGINX :8005 — PERJALANAN DINAS (KWITANSI PERDIN)
# =========================================================
#
# Alamat: http://192.168.221.44:8005  (→ /perjalanan-dinas)
#   /perjalanan-dinas        dashboard per bidang (login operator)
#   /perjalanan-dinas/baru   form baru; /perjalanan-dinas/<id> ubah
#
# Daftar pegawai untuk isian peserta diambil lewat /api/kwitansi/pegawai
# (hanya nama, NIP, jabatan, wajib login) — /api/pegawai TIDAK dibuka.

server {
    listen 8005;
    listen [::]:8005;
    server_name _;

    client_max_body_size 5m;

    access_log /var/log/nginx/siska-8005.access.log;
    error_log  /var/log/nginx/siska-8005.error.log;

    location = / { return 302 /perjalanan-dinas; }
    location ~ ^/admin/kwitansi/?$ { return 302 /perjalanan-dinas; }
    location ~ ^/admin/kwitansi/(.+)$ { return 302 /perjalanan-dinas/$1; }

    location ~ ^/perjalanan-dinas(/[^/]+)?/?$ { include snippets/siska-proxy.conf; }
    location /assets/ { include snippets/siska-proxy.conf; }
    location ~ ^/(favicon\.svg|icons\.svg|logo-kemnaker\.png)$ { include snippets/siska-proxy.conf; }

    location ~ ^/api/kwitansi(/|$) { include snippets/siska-proxy.conf; }

    location / { return 404; }
}
