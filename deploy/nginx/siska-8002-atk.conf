# =========================================================
# NGINX :8002 — STOK ATK (KATALOG + KELOLA BARANG)
# =========================================================
#
# Alamat: http://192.168.221.44:8002
#   /           → /atk (katalog; tautan LINK_WEB_KATALOG di WhatsApp)
#   /atk        katalog permintaan ATK untuk pegawai
#   /atk/kelola dashboard stok & rekap mutasi untuk operator barang
#
# Hanya halaman dan API Stok ATK yang diteruskan. Modul lain punya port
# sendiri (lihat README.md); alamat lamanya yang dulu semua ada di :8002
# dialihkan ke port barunya supaya bookmark tidak mati.

server {
    listen 8002;
    listen [::]:8002;
    server_name _;

    # Dashboard barang mengirim foto base64 lewat POST/PUT /api/barang.
    # Default nginx 1 MB akan menolaknya dengan 413.
    client_max_body_size 20m;

    access_log /var/log/nginx/siska-8002.access.log;
    error_log  /var/log/nginx/siska-8002.error.log;

    location = / { return 302 /atk; }

    # Halaman modul (SPA) dan berkas statis hasil build
    location ~ ^/atk(/kelola)?/?$ { include snippets/siska-proxy.conf; }
    location /assets/ { include snippets/siska-proxy.conf; }
    location ~ ^/(favicon\.svg|icons\.svg|logo-kemnaker\.png)$ { include snippets/siska-proxy.conf; }

    # API modul
    location ~ ^/api/(barang|mutasi-barang)(/|$) { include snippets/siska-proxy.conf; }

    # Alamat lama di :8002
    location ~ ^/(admin/)?barang/?$ { return 302 /atk/kelola; }
    location ~ ^/admin/?$ { return 302 http://$host:8003/pegawai; }
    location ~ ^/admin/servis-kendaraan/?$ { return 302 http://$host:8004/kendaraan/pemeliharaan; }
    location ~ ^/admin/kwitansi/?$ { return 302 http://$host:8005/perjalanan-dinas; }
    location ~ ^/admin/kwitansi/(.+)$ { return 302 http://$host:8005/perjalanan-dinas/$1; }

    location / { return 404; }
}
