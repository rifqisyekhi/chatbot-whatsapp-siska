# =========================================================
# NGINX :8005 — DASHBOARD TATA USAHA ROKEU
# =========================================================
#
# Alamat: http://192.168.221.44:8005  (→ /tata-usaha)
#   /tata-usaha/perjalanan-dinas     perjalanan dinas per bidang
#   /tata-usaha/langganan-aplikasi   ┐
#   /tata-usaha/fotokopi             │ fitur lain (sidebar yang sama,
#   /tata-usaha/bbm-kepala-biro      │ daftar di frontend/src/tataUsaha/menu.js)
#   /tata-usaha/konsumsi             ┘
# Fitur baru di bawah /tata-usaha/ TIDAK perlu mengubah berkas ini.
#
# API: hanya /api/kwitansi/... (termasuk /api/kwitansi/<fitur>/...).
# Daftar pegawai untuk isian peserta lewat /api/kwitansi/pegawai (hanya
# nama, NIP, jabatan, wajib login) — /api/pegawai TIDAK dibuka.

server {
    listen 8005;
    listen [::]:8005;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/siska-8005.access.log;
    error_log  /var/log/nginx/siska-8005.error.log;

    location = / { return 302 /tata-usaha; }

    # Alamat lama
    location ~ ^/perjalanan-dinas(/.*)?$ { return 302 /tata-usaha/perjalanan-dinas$1; }
    location ~ ^/admin/kwitansi/?$ { return 302 /tata-usaha/perjalanan-dinas; }
    location ~ ^/admin/kwitansi/(.+)$ { return 302 /tata-usaha/perjalanan-dinas/$1; }

    # Halaman (SPA) dan berkas statis hasil build
    location ~ ^/tata-usaha(/.*)?$ { include snippets/siska-proxy.conf; }
    location /assets/ { include snippets/siska-proxy.conf; }
    location ~ ^/(favicon\.svg|icons\.svg|logo-kemnaker\.png)$ { include snippets/siska-proxy.conf; }

    location ~ ^/api/kwitansi(/|$) { include snippets/siska-proxy.conf; }

    location / { return 404; }
}
