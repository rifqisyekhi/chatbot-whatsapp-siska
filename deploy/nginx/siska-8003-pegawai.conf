# =========================================================
# NGINX :8003 — MASTER DATA PEGAWAI
# =========================================================
#
# Alamat: http://192.168.221.44:8003  (→ /pegawai)
#
# Berisi data pribadi pegawai (NIP, nomor WA). Hanya halaman dan API
# pegawai yang diteruskan; modul lain tidak bisa dibuka dari port ini.

server {
    listen 8003;
    listen [::]:8003;
    server_name _;

    client_max_body_size 5m;

    access_log /var/log/nginx/siska-8003.access.log;
    error_log  /var/log/nginx/siska-8003.error.log;

    location = / { return 302 /pegawai; }
    location ~ ^/admin/?$ { return 302 /pegawai; }

    location ~ ^/pegawai/?$ { include snippets/siska-proxy.conf; }
    location /assets/ { include snippets/siska-proxy.conf; }
    location ~ ^/(favicon\.svg|icons\.svg|logo-kemnaker\.png)$ { include snippets/siska-proxy.conf; }

    location ~ ^/api/pegawai(/|$) { include snippets/siska-proxy.conf; }

    location / { return 404; }
}
